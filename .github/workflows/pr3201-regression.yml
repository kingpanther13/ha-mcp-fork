name: PR 3201 pre-fix regressions
on:
  push:
    branches: [verify/logbook-3201-review-regressions]
permissions:
  contents: read
jobs:
  logbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: uv run --group dev pytest tests/src/unit/test_tools_utility_logbook_transports.py -k 'invalid_context_cannot or cursor_reads_matches_committed or sparse_search_across' -q --tb=short
