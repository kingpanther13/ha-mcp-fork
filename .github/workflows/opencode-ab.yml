name: optional-params repro (issue 2873)
on:
  push:
    branches: [scratch/2873-optional-params]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.m.outputs.models }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i -g opencode-ai@1.18.32
      - id: m
        run: |
          opencode models opencode | tee models.txt
          # Free-tier models only (no provider key on this runner).
          models=$(python3 -c "import json,sys; ms=[l.strip() for l in open('models.txt') if l.strip().startswith('opencode/') and ('free' in l or 'pickle' in l)]; print(json.dumps(ms[:8]))")
          echo "models=$models" >> "$GITHUB_OUTPUT"
          echo "$models"

  run:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.discover.outputs.models) }}
        variant: [create, update]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm i -g opencode-ai@1.18.32 && opencode --version
      - name: Write opencode config
        run: |
          cat > opencode.json <<EOF
          {"\$schema": "https://opencode.ai/config.json",
           "mcp": {"stubha": {"type": "local", "command": ["python", "stub_mcp.py"], "enabled": true,
                              "environment": {"WIRE_LOG": "${{ github.workspace }}/wire.log"}}}}
          EOF
      - name: Runs
        env:
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir -p logs
          R=" If the tool returns an error, fix the call and try again, up to 3 attempts in total. Stop as soon as it succeeds."
          case "$VARIANT" in
            create) P="Use the stubha ha_config_set_automation tool to create a new automation: alias 'Porch light at sunset', triggered at sunset, action light.turn_on on light.porch.$R";;
            update) P="Use the stubha tools to update the existing automation automation.morning_lights so its action turns on light.kitchen instead of light.bedroom. Read it with ha_config_get_automation first, then write the full updated config with ha_config_set_automation.$R";;
          esac
          for i in $(seq 1 5); do
            rm -f wire.log
            timeout 300 opencode run -m "$MODEL" "$P" > logs/run$i.out 2>&1 || true
            [ -f wire.log ] && cp wire.log logs/run$i.wire.log
            echo "{\"run\": $i, \"model\": \"$MODEL\", \"variant\": \"$VARIANT\", \"result\": $(python classify.py wire.log)}" | tee -a results.jsonl
          done
      - name: Artifact name
        id: n
        run: echo "name=$(echo '${{ matrix.model }}-${{ matrix.variant }}' | tr '/:' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-${{ steps.n.outputs.name }}
          path: |
            results.jsonl
            logs/
