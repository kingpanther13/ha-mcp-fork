name: SLF001 guard regression proof

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full candidate commit SHA containing the regression tests
        required: true
        type: string
      baseline:
        description: Full pre-fix commit SHA
        required: true
        type: string
        default: db84b3148eb761eb81a3c978841fee45d80766c6
      baseline_only:
        description: Prove baseline failures before implementation is ready
        type: boolean
        default: false
      profile_only:
        description: Profile the whole-tree scan hotspot
        type: boolean
        default: false
      windows_only:
        description: Run only the native Windows path proof
        type: boolean
        default: false
      boundary_baseline:
        description: Optional exact guard SHA for focused pre-fix boundary proof
        type: string
        default: ""
      diagnostic_lines_only:
        description: Prove missing and incorrect CLI source lines fail the focused test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  proof:
    if: github.repository == 'kingpanther13/ha-mcp-fork' && !inputs.windows_only && !inputs.profile_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROBE_ROOT: /tmp/slf001-review-proof
      PROBE_BASELINE: ${{ inputs.baseline }}
      PROBE_BASELINE_ONLY: ${{ inputs.baseline_only }}
      PROBE_BOUNDARY_BASELINE: ${{ inputs.boundary_baseline }}
      PROBE_DIAGNOSTIC_LINES_ONLY: ${{ inputs.diagnostic_lines_only }}
      PROBE_CANDIDATE: ${{ inputs.revision }}
    steps:
      - name: Check out the isolated proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proof
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.14'
      - name: Install full development dependencies for real Core fixtures
        working-directory: candidate
        run: uv sync --all-extras --dev
      - name: Prove exact regressions and diagnostic-line mutations
        working-directory: candidate
        run: uv run python ../proof/.github/scripts/slf001_guard_probe.py
      - name: Preserve source evidence, logs, and JUnit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slf001-review-regression-proof
          path: ${{ env.PROBE_ROOT }}
          if-no-files-found: error

  windows-paths:
    if: github.repository == 'kingpanther13/ha-mcp-fork' && !inputs.profile_only
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PROBE_BASELINE: ${{ inputs.baseline }}
      PROBE_BASELINE_ONLY: ${{ inputs.baseline_only }}
      PROBE_CANDIDATE: ${{ inputs.revision }}
    steps:
      - name: Check out the isolated proof driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: proof
          persist-credentials: false
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: candidate
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.14'
      - name: Prove both CLI diagnostic paths on native Windows
        working-directory: candidate
        run: uv run --no-project python ../proof/.github/scripts/slf001_windows_paths.py
      - name: Preserve Windows source and CLI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: slf001-windows-paths
          path: ${{ runner.temp }}/slf001-windows-paths
          if-no-files-found: error

  profile:
    if: github.repository == 'kingpanther13/ha-mcp-fork' && inputs.profile_only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source:
          - tests/src/unit/_integration_flow_steps_core.py
          - tests/src/unit/test_find_cards_badges_headers.py
          - tests/src/unit/test_locale_parity.py
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.9'
          python-version: '3.14'
      - name: Profile the whole-tree hotspot on the exact candidate
        env:
          PROBE_CANDIDATE: ${{ inputs.revision }}
          PROBE_FILE: ${{ matrix.source }}
        working-directory: candidate
        run: uv run --no-project python ../proof/.github/scripts/slf001_profile.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: slf001-profile-${{ strategy.job-index }}
          path: /tmp/slf001-profile
          if-no-files-found: error
