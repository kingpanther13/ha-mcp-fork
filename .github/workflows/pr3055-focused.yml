name: PR 3055 focused regression
on:
  push:
    branches: [verify/pr3055-focused-1121]
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: uv run --group dev pytest tests/src/unit/test_tools_camera{,_image_entities}.py -q --tb=short
