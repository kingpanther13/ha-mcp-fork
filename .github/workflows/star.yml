name: Live test ha-mcp#2937 star history
on:
  push:
    branches: [live-test-pr2937]
    paths: [.github/workflows/star.yml]
permissions:
  contents: read
env:
  BASE: 2556e9fe2240be3e7d1908a50d7f8478870ed2ba
  HEAD: d32ce82423d4be267372a8defb44bc1a81a7b75a
jobs:
  render:
    # The Actions token may read only this repository's stargazers.
    strategy:
      matrix:
        side: [B, H]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render with the ${{ matrix.side }} script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          sha=$HEAD; [ "${{ matrix.side }}" = B ] && sha=$BASE
          curl -fsSL "https://raw.githubusercontent.com/homeassistant-ai/ha-mcp/$sha/scripts/generate_star_history.py" -o gsh.py
          for repo in ${{ github.repository }}; do
            out=out/${repo//\//_}
            python gsh.py --repository "$repo" --output-dir "$out"; echo "rc=$?" | tee "$out.rc"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: star-${{ matrix.side }}
          path: out
  compare:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Compare base and head charts
        run: |
          status=0
          for f in $(cd star-H && find . -type f | sort); do
            if cmp -s "star-B/$f" "star-H/$f"; then echo "PASS: identical $f"; else echo "FAIL: differs $f"; status=1; fi
          done
          grep -ho '<desc>[^<]*' star-H/*/light.svg
          exit $status
