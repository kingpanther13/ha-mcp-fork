name: Issue 2581 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.20'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Restore production workflow for repository contract tests
        run: git checkout HEAD^ -- .github/workflows/test.yml
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          cd tests/js && corepack npm ci
      - name: Prove ignored-disable warning regression on base
        run: |
          git worktree add --detach /tmp/issue2581-base 93f015402af3bf9f950ec159ce6c8aefd7968fb4
          cp tests/src/unit/test_mandatory_tool_warnings.py /tmp/issue2581-base/tests/src/unit/
          cd /tmp/issue2581-base
          git submodule update --init
          uv sync --all-extras --dev
          set +e
          uv run pytest tests/src/unit/test_mandatory_tool_warnings.py -k test_visibility_warns_for_each_ignored_disable --tb=short --junitxml=/tmp/issue2581-red.xml
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/issue2581-red.xml').getroot()
          failures = root.findall('.//failure')
          assert len(failures) == 2, [f.attrib for f in failures]
          assert not root.findall('.//error')
          assert all('assert ' in (f.text or '') for f in failures)
          print('Confirmed: both ignored mandatory-disable warning cases fail on the original code.')
          PY
      - name: Lint and types
        run: |
          uv run ruff check src/ tests/ homeassistant-addon/ scripts/
          git diff --name-only 93f015402af3bf9f950ec159ce6c8aefd7968fb4 HEAD -- '*.py' | xargs uv run ruff format --check
          uv run mypy src/ homeassistant-addon/ scripts/
          uv run ast-grep scan
      - name: Unit and app configuration tests
        run: uv run pytest tests/src/unit/ tests/addon/ -n auto --tb=short
      - name: Backup and read-only E2E
        working-directory: tests
        run: uv run pytest src/e2e/workflows/auto_backup/ src/e2e/workflows/convenience/test_backup.py src/e2e/policy/test_readonly_mode.py src/e2e/policy/test_readonly_endpoint.py -n2 --dist loadscope --tb=short
