name: Issue 2581 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.20'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Restore production workflow for repository contract tests
        run: git checkout HEAD^ -- .github/workflows/test.yml
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev
          cd tests/js && corepack npm ci
      - name: Lint and types
        run: |
          uv run ruff check src/ tests/ homeassistant-addon/ scripts/
          git diff --name-only 93f015402af3bf9f950ec159ce6c8aefd7968fb4 HEAD -- '*.py' | xargs uv run ruff format --check
          uv run mypy src/ homeassistant-addon/ scripts/
          uv run ast-grep scan
      - name: Unit and app configuration tests
        if: success() || failure()
        run: uv run pytest tests/src/unit/ tests/addon/ -n auto --tb=short --maxfail=0
