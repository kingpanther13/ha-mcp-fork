name: Dev HAOS embedded environment

# A long-running HAOS instance with the embedded ha-mcp server built from
# TRACK_REF, behind a temporary Cloudflare tunnel. The bring-up is the HAOS
# e2e session fixture itself (HAOS_TEST_MODE=embedded), held open by a test
# that sleeps. The tunnel URL and the embedded webhook path are published as the
# `devenv-haos` artifact. Cancel the run when done.
on:
  # A push to devenv-haos/<name> runs the ref named in .github/devenv/haos-track-ref.
  push:
    branches: ["devenv-haos/**"]
  workflow_dispatch:
    inputs:
      track_ref:
        description: Branch whose server wheel, component and test config to run
        required: true
      minutes:
        description: How long to keep the instance up
        default: "300"

permissions:
  contents: read

concurrency:
  group: dev-haos-env-${{ github.ref_name }}-${{ inputs.track_ref }}
  cancel-in-progress: true

env:
  LIBGUESTFS_BACKEND: direct
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  env:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: devenv
      - name: Resolve the tracked ref
        id: ref
        run: |
          ref="${{ inputs.track_ref }}"
          [ -n "$ref" ] || ref=$(cat devenv/.github/devenv/haos-track-ref)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          submodules: true
          fetch-depth: 0

      - name: Compute image cache key
        id: key
        working-directory: src
        run: |
          hash=$(git ls-tree -r HEAD \
            tests/haos_image_build \
            tests/initial_test_state \
            custom_components/ha_mcp_tools \
            homeassistant-addon-webhook-proxy \
            | grep -v '\.md$' | sha256sum | cut -d' ' -f1 | head -c16)
          echo "cache-key=haos-image-$hash" >> "$GITHUB_OUTPUT"
      - name: Restore image from cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/haos-test-image.qcow2
          key: ${{ steps.key.outputs.cache-key }}
      - name: Install QEMU + OVMF + libguestfs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xz-utils curl libguestfs-tools sshpass
          sudo chmod +r /boot/vmlinuz-*
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build image (cache miss)
        if: steps.restore-cache.outputs.cache-hit != 'true'
        working-directory: src
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup
          docker system prune -af --volumes || true
          pip install -r tests/haos_image_build/requirements.txt
          python3 tests/haos_image_build/build_image.py --verbose --output /tmp/haos-test-image.qcow2
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        working-directory: src
        run: uv python install 3.13 && uv sync --all-extras --dev
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Boot HAOS with the embedded server and open the tunnel
        env:
          HAMCP_ENV_FILE: "tests/.env.test"
          HAOS_TEST_IMAGE_PATH: /tmp/haos-test-image.qcow2
          HAOS_TEST_MODE: embedded
          GITHUB_TOKEN: ${{ github.token }}
          DEVENV_INFO: ${{ github.workspace }}/devenv-info.json
          DEVENV_MINUTES: ${{ inputs.minutes || '300' }}
        run: |
          cp devenv/.github/devenv/test_devenv_haos_hold.py src/tests/src/e2e/
          # Agents meet strict best-practices mode by default; e2e pins it off.
          sed -i 's/"enable_strict_mandatory_bps": False/"enable_strict_mandatory_bps": True/'             src/tests/src/e2e/conftest.py
          grep -q '"enable_strict_mandatory_bps": True' src/tests/src/e2e/conftest.py
          cd src/tests
          nohup uv run pytest src/e2e/test_devenv_haos_hold.py -v -s --timeout=0 \
            -p no:randomly > ../../hold.log 2>&1 &
          echo $! > ../../hold.pid
          cd ../..
          for i in $(seq 1 240); do
            [ -s devenv-info.json ] && break
            kill -0 "$(cat hold.pid)" 2>/dev/null || break
            sleep 5
          done
          if [ ! -s devenv-info.json ]; then echo "HAOS never came up"; tail -150 hold.log; exit 1; fi
          BASE=$(python3 -c "import json;print(json.load(open('devenv-info.json'))['base_url'])")
          nohup ./cloudflared tunnel --no-autoupdate --url "$BASE" > tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break; sleep 2
          done
          python3 - "$URL" <<'PY'
          import json, sys
          info = json.load(open("devenv-info.json"))
          base, url = info["base_url"], sys.argv[1]
          webhook = (info["embedded_webhook_url"] or "").replace(base, url)
          json.dump({"url": url, "embedded_webhook_url": webhook}, open("devenv-haos.json", "w"))
          print(json.dumps({"url": url, "embedded_webhook_url": webhook}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: devenv-haos
          path: devenv-haos.json
          retention-days: 1
      - name: Keep running
        run: |
          while kill -0 "$(cat hold.pid)" 2>/dev/null; do
            sleep 60
            grep -E "Traceback|ERROR|FAILED" hold.log | tail -2 || true
          done
          tail -80 hold.log
      - name: Logs
        if: always()
        run: tail -200 hold.log || true; tail -40 tunnel.log || true
