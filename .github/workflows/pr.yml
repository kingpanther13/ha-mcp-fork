name: E2E topology focused validation
on:
  workflow_dispatch:
    inputs:
      track_ref:
        required: true
        default: refactor/e2e-topology-runners
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.track_ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: uv python install 3.14
      - run: uv sync --all-extras --dev
      - name: Format and lint changed Python files
        run: |
          mapfile -t changed < <(git diff --name-only d46b3c8491a97064748f04d6f36368aafc5a31dd HEAD -- '*.py')
          uv run ruff check --fix "${changed[@]}"
          uv run ruff format "${changed[@]}"
      - name: Save formatting patch
        if: always()
        run: git diff > /tmp/topology-format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: topology-format
          path: /tmp/topology-format.patch
      - name: Scheduler and workflow regression tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests/src/unit/test_e2e_topology_scheduling.py tests/src/unit/test_e2e_lane_env_shape.py tests/src/unit/test_e2e_skip_gate_shape.py -q --maxfail=0
      - name: Collect combined E2E suite
        if: ${{ !cancelled() }}
        env:
          E2E_COMBINE_TOPOLOGIES: '1'
          HAMCP_ENV_FILE: tests/.env.test
        run: |
          uv run pytest tests/src/e2e/ --collect-only -q > /tmp/topology-collection.log 2>&1
          tail -4 /tmp/topology-collection.log
      - name: Live container transition
        if: ${{ !cancelled() }}
        env:
          E2E_COMBINE_TOPOLOGIES: '1'
          HAMCP_ENV_FILE: tests/.env.test
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run pytest tests/src/e2e/workflows/filesystem/test_tools_entry_absent.py tests/src/e2e/workflows/filesystem/test_file_operations.py tests/src/e2e/tools/test_search_entities.py -n2 --dist loadscope -k 'gated_tool_fails_actionably or service_domain_absent or shared_capabilities_survive or read_configuration_yaml or successful_fuzzy_search_no_warning' -v --tb=short --maxfail=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: topology-collection
          path: /tmp/topology-collection.log
