name: SLF001 branch validation
on:
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
      test_selection:
        type: choice
        options: [full, auth-probe]
        default: full
      run_tests:
        type: boolean
        default: true
      base:
        required: true
        type: string
        default: 48bea5b6
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ghcr.io/astral-sh/uv:0.13.9-python3.14-trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git jq >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: uv sync --all-extras --dev
      - run: cd tests/js && corepack npm ci
      - name: Format changed Python files
        env:
          BASE: ${{ inputs.base }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' > /tmp/changed-python
          xargs -r uv run ruff check --fix < /tmp/changed-python || true
          xargs -r uv run ruff format < /tmp/changed-python
          git diff > /tmp/format.patch
          test ! -s /tmp/format.patch
      - name: Lint and rules
        if: always()
        run: |
          failed=0
          uv run ruff check src/ custom_components/ scripts/ tests/ > /tmp/ruff.txt 2>&1 || failed=1
          uv run ast-grep scan > /tmp/ast-grep.txt 2>&1 || failed=1
          exit "$failed"
      - name: Types
        if: always()
        run: |
          failed=0
          uv run mypy src/ custom_components/ homeassistant-addon/ scripts/ > /tmp/mypy-src.txt 2>&1 || failed=1
          uv run mypy homeassistant-addon-webhook-proxy/ > /tmp/mypy-proxy.txt 2>&1 || failed=1
          uv run mypy homeassistant-addon-webhook-proxy-dev/ > /tmp/mypy-proxy-dev.txt 2>&1 || failed=1
          uv run mypy tests/src/unit/ tests/addon/ > /tmp/mypy-tests.txt 2>&1 || failed=1
          exit "$failed"
      - name: Preserve early formatting and static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slf001-early-checks
          path: |
            /tmp/format.patch
            /tmp/ruff.txt
            /tmp/ast-grep.txt
            /tmp/mypy-*.txt
      - name: Public seams and ratchets
        if: always()
        env:
          BASE: ${{ inputs.base }}
        run: |
          failed=0
          uv run python scripts/test_only_public_names.py > /tmp/public-names.txt 2>&1 || failed=1
          uv run python scripts/stand_in_lists_ratchet.py --base "$BASE" > /tmp/stand-ins.txt 2>&1 || failed=1
          if test -f scripts/private_test_access.py; then
            timeout 300 uv run python -c 'import ast, faulthandler, runpy, sys, time; sys.path.insert(0, "scripts"); faulthandler.dump_traceback_later(60, repeat=True); original=ast.parse; ast.parse=lambda source, filename="<unknown>", **kwargs: (print(time.monotonic(), filename, flush=True), original(source, filename=filename, **kwargs))[1]; runpy.run_path("scripts/private_test_access.py", run_name="__main__")' > /tmp/private-access.txt 2>&1 || failed=1
            mkdir -p /tmp/slf001-base
            git archive "$BASE" tests/src/unit tests/addon | tar -x -C /tmp/slf001-base
            if timeout 300 uv run python scripts/private_test_access.py --repo /tmp/slf001-base > /tmp/private-access-baseline.txt 2>&1; then
              failed=1
            else
              status=$?
              test "$status" = 1 || failed=1
              grep -q 'private string target' /tmp/private-access-baseline.txt || failed=1
            fi
          fi
          uv run python scripts/module_size_ratchet.py --check > /tmp/module-size.txt 2>&1 || failed=1
          uv run python scripts/duplicate_code_ratchet.py --check > /tmp/duplicate-code.txt 2>&1 || failed=1
          exit "$failed"
      - name: Guard behavioral tests
        if: always() && hashFiles('scripts/private_test_access.py') != ''
        run: uv run pytest tests/src/unit/test_server_answer_rule.py tests/src/unit/test_ha_search_response_contract.py -n 2 --tb=short --maxfail=0 -v > /tmp/guard-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slf001-checks
          path: |
            /tmp/*.txt
            /tmp/format.patch
      - name: Unit and app tests
        if: always() && inputs.run_tests
        env:
          TEST_SELECTION: ${{ inputs.test_selection }}
        run: |
          if [ "$TEST_SELECTION" = "auth-probe" ]; then
            uv run pytest tests/src/unit/test_auth_close_probe.py -n 0 --tb=short --maxfail=0 -v > /tmp/pytest.txt 2>&1
          else
            uv run pytest tests/src/unit/ tests/addon/ --ignore=tests/addon/test_addon_startup.py -n 4 --tb=short --maxfail=0 -v > /tmp/pytest.txt 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slf001-diagnostics
          path: |
            /tmp/*.txt
            /tmp/format.patch
