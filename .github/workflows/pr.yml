name: E2E topology focused validation
on:
  workflow_dispatch:
    inputs:
      track_ref:
        required: true
        default: refactor/e2e-topology-runners
      live:
        type: boolean
        default: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.track_ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
      - run: uv python install 3.14
      - run: uv sync --all-extras --dev
      - name: Format and lint changed Python files
        run: |
          mapfile -t changed < <(git diff --name-only d46b3c8491a97064748f04d6f36368aafc5a31dd HEAD -- '*.py')
          uv run ruff format --check "${changed[@]}" 2>&1 | tee /tmp/topology-lint.log
          uv run ruff check "${changed[@]}" 2>&1 | tee -a /tmp/topology-lint.log
      - name: Save formatting patch
        if: always()
        run: git diff > /tmp/topology-format.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: topology-format
          path: |
            /tmp/topology-format.patch
            /tmp/topology-lint.log
      - name: Component version and server pin match the server version
        run: |
          python3 - <<'PY'
          import json, re, sys, tomllib
          sys.path.insert(0, "custom_components/ha_mcp_tools")
          from server_pin import server_pins
          server = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("custom_components/ha_mcp_tools/manifest.json"))
          const = open("custom_components/ha_mcp_tools/const.py").read()
          pins = server_pins(manifest["requirements"])
          found = {
              "manifest.json version": (manifest["version"], server),
              "manifest.json server pin": (
                  pins[0] if len(pins) == 1 else pins, f"ha-mcp=={server}"),
              "const.py COMPONENT_VERSION": (
                  m.group(1) if (m := re.search(
                      r'^COMPONENT_VERSION = "([^"]+)"', const, re.M)) else None,
                  server),
          }
          wrong = {k: v for k, v in found.items() if v[0] != v[1]}
          for key, (value, expected) in wrong.items():
              print(f"::error::{key} is {value!r}, but pyproject.toml's version "
                    f"{server!r} needs {expected!r}. semantic-release stamps these "
                    "at release time; restore them "
                    "(docs/agents/custom-component.md#version-cycle).")
          sys.exit(1 if wrong else 0)
          PY
      - name: Ratchets against the branch base
        if: ${{ !cancelled() }}
        run: |
          uv run python scripts/module_size_ratchet.py --base d46b3c8491a97064748f04d6f36368aafc5a31dd
          uv run python scripts/duplicate_code_ratchet.py --base d46b3c8491a97064748f04d6f36368aafc5a31dd
          uv run python scripts/stand_in_lists_ratchet.py --base d46b3c8491a97064748f04d6f36368aafc5a31dd
      - name: Scheduler and workflow regression tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests/src/unit/test_e2e_topology_scheduling.py tests/src/unit/test_e2e_lane_env_shape.py tests/src/unit/test_e2e_skip_gate_shape.py -q --maxfail=0 2>&1 | tee /tmp/topology-unit.log
      - name: Collect combined E2E suite
        if: ${{ !cancelled() }}
        env:
          E2E_COMBINE_TOPOLOGIES: '1'
          HAMCP_ENV_FILE: tests/.env.test
        run: |
          uv run pytest tests/src/e2e/ --collect-only -q > /tmp/topology-collection.log 2>&1
          tail -4 /tmp/topology-collection.log
      - name: Live container transition
        if: ${{ !cancelled() && inputs.live }}
        env:
          E2E_COMBINE_TOPOLOGIES: '1'
          HAMCP_ENV_FILE: tests/.env.test
          TESTCONTAINERS_RYUK_DISABLED: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run pytest tests/src/e2e/workflows/filesystem/test_tools_entry_absent.py tests/src/e2e/workflows/filesystem/test_file_operations.py tests/src/e2e/tools/test_search_entities.py -n2 --dist loadscope -k 'gated_tool_fails_actionably or service_domain_absent or shared_capabilities_survive or read_configuration_yaml or successful_fuzzy_search_no_warning' -v --tb=short --maxfail=0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: topology-collection
          path: |
            /tmp/topology-collection.log
            /tmp/topology-unit.log
