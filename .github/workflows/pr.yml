name: SLF001 format preflight mutation proof
on:
  workflow_dispatch:
    inputs:
      revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/astral-sh/uv:0.13.9-python3.14-trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Install candidate dependencies
        working-directory: candidate
        run: uv sync --all-extras --dev
      - name: Prove formatting is bounded before allocation
        working-directory: candidate
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          git config --global --add safe.directory "$PWD"
          python ../harness/local_proof/format_preflight_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: format-preflight-proof
          path: candidate/format-proof/
