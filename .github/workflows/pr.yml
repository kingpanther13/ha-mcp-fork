name: PR non-E2E candidate checks
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit
        required: true
      base:
        description: Exact comparison base
        required: true
      mode:
        description: Run all non-E2E checks or prepare a formatting patch
        default: full
        type: choice
        options: [full, prepare]
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: /tmp/.uv-cache
  # renovate: datasource=docker depName=ghcr.io/home-assistant/home-assistant
  HA_IMAGE_GHCR: "ghcr.io/home-assistant/home-assistant:2026.11.2"
  # Disable Testcontainers' Ryuk reaper: it has been reported to leave
  # zombie containers on GHA runners (see #366, Ilya0527 2026-05-18).
  # The E2E fixture in tests/src/e2e/conftest.py relies instead on the
  # enclosing ``with container:`` context manager — Python guarantees
  # its ``__exit__`` fires on both normal and exception flows, so the
  # Ryuk safety net is not needed for deterministic cleanup. Refs #366.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  component-version-gate:
    if: inputs.mode != 'prepare'
    name: Component Version Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Component version and server pin match the server version
        run: |
          python3 - <<'PY'
          import json, re, sys, tomllib
          sys.path.insert(0, "custom_components/ha_mcp_tools")
          from server_pin import server_pins
          server = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("custom_components/ha_mcp_tools/manifest.json"))
          const = open("custom_components/ha_mcp_tools/const.py").read()
          pins = server_pins(manifest["requirements"])
          found = {
              "manifest.json version": (manifest["version"], server),
              "manifest.json server pin": (
                  pins[0] if len(pins) == 1 else pins, f"ha-mcp=={server}"),
              "const.py COMPONENT_VERSION": (
                  m.group(1) if (m := re.search(
                      r'^COMPONENT_VERSION = "([^"]+)"', const, re.M)) else None,
                  server),
          }
          wrong = {k: v for k, v in found.items() if v[0] != v[1]}
          for key, (value, expected) in wrong.items():
              print(f"::error::{key} is {value!r}, but pyproject.toml's version "
                    f"{server!r} needs {expected!r}. semantic-release stamps these "
                    "at release time; restore them "
                    "(docs/agents/custom-component.md#version-cycle).")
          sys.exit(1 if wrong else 0)
          PY

  fast-checks:
    if: inputs.mode != 'prepare'
    name: Fast Checks
    runs-on: ubuntu-latest
    # 15 covers the serial worst case: two Docker image pulls (~1 min), one
    # `uv sync --dev`, the HA-constraints fetch budget (3 x 10s + backoff,
    # sized in tests/src/unit/test_ha_constraint_alignment.py — the fetch must
    # exit on its own code, never as an opaque runner kill), and the four
    # linters. Observed full-lane time: ~1.5 min; the headroom is for cold
    # caches and slow image pulls.
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.candidate }}
        persist-credentials: false

    - name: Docs Size Check
      run: |
        max_chars=16000
        max_lines=200
        chars=$(LC_ALL=C.UTF-8 wc -m < AGENTS.md)
        lines=$(wc -l < AGENTS.md)
        if [ "$chars" -gt "$max_chars" ] || [ "$lines" -gt "$max_lines" ]; then
          echo "::error file=AGENTS.md::AGENTS.md is ${chars} Unicode characters and ${lines} lines; keep the canonical startup guidance at or below ${max_chars} characters and ${max_lines} lines, and move scoped detail to linked documents."
          exit 1
        fi

    - name: HACS validation
      if: success() || failure()
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration

    # Drop vendored third-party fixtures (e.g. the upstream HACS integration
    # used as an e2e fixture) so hassfest only validates integrations this repo
    # owns. Mirrors scripts/codeql_quality_gate.py's PATHS_IGNORE convention.
    # Restored right after Hassfest so the later checks see the tracked tree
    # again (a fresh CI checkout holds nothing untracked here).
    - name: Remove vendored test fixtures
      if: success() || failure()
      run: rm -rf tests/initial_test_state

    - name: Hassfest
      if: success() || failure()
      uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

    - name: Restore vendored test fixtures
      # The restore must be verified: the fixture tree holds 59 tracked .py
      # files that ast-grep and the changed-files format check walk, so a
      # silently failed restore would stamp green checks on a reduced file set.
      if: success() || failure()
      run: |
        git checkout HEAD -- tests/initial_test_state
        if ! git diff --quiet HEAD -- tests/initial_test_state; then
          echo "::error::tests/initial_test_state was not fully restored; the lint steps below would silently skip its files"
          exit 1
        fi

    - name: Install uv
      # Pinned, not "latest": the folded jobs got uv from the Renovate-pinned
      # container image, and `uv lock --check` is sensitive to the uv version.
      # renovate.json groups this github-releases pin with the unit-tests
      # job's container image tag (group "uv"), so both move in one Renovate
      # PR and cannot drift apart.
      if: success() || failure()
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # renovate: datasource=github-releases depName=astral-sh/uv
        version: "0.13.7"

    - name: Set up Python
      if: success() || failure()
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Verify uv.lock is in sync with pyproject.toml
      if: success() || failure()
      run: uv lock --check

    - name: Check dependency alignment with HA core constraints
      if: success() || failure()
      # Mechanical link to HA's own package_constraints.txt (#2135/#2146):
      # where HA pins a shared dependency exactly, ha-mcp must admit the pin;
      # where HA is loose, ha-mcp must not pin exactly (an exact pin forces
      # pip to replace the image-shipped copy in place — the torn-install
      # window). Check the current E2E image AND the HACS minimum: a Core
      # image update must not silently strand users on the supported floor.
      # For the image's Core, uv.lock must also hold Core's exact pin for every
      # runtime package, so the Docker/app images and the embedded install run
      # the same versions.
      # Direct dependencies are checked at both endpoints, the locked runtime
      # closure only for the image's Core. Existing current
      # Core/beta E2E lanes cover actual installs and runtime compatibility.
      # Rules unit-tested offline in
      # tests/src/unit/test_ha_constraint_alignment.py.
      #
      # Exit codes are load-bearing: 1 is a real drift violation and fails
      # the job; 78 means HA's constraints file was UNREACHABLE, which is an
      # outage on someone else's server and must not red-light every open PR
      # — it warns and passes, the same fail-open the component-version gate
      # above uses when the mirror API is unreadable. Every other code
      # (including argparse's 2 for a usage error, uv's own 2, and a 4xx
      # meaning the constraints file moved) fails the job: those are our
      # problems, and failing open on them would leave this gate green
      # forever while it checked nothing.
      run: |
        minimum=$(python3 -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')
        [[ "$minimum" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]
        failed=0
        image="${HA_IMAGE_GHCR##*:}"
        for ha_version in "$image" "$minimum"; do
          status=0
          lock=()
          # uv.lock tracks the image's Core (the dev group pins it), not the floor.
          [ "$ha_version" = "$image" ] && lock=(--lock uv.lock)
          uv run --no-project --with packaging python \
            scripts/check_ha_constraint_alignment.py \
            --ha-version "$ha_version" "${lock[@]}" || status=$?
          if [ "$status" -eq 78 ]; then
            echo "::warning::could not reach HA ${ha_version} constraints - dependency alignment for this version was not verified"
          elif [ "$status" -ne 0 ]; then
            failed=1
          fi
        done
        exit "$failed"

    - name: Install dependencies
      # One install for ruff, ast-grep and mypy. The three folded jobs each ran
      # their own; this is where most of the fold's wall-clock saving comes from.
      if: success() || failure()
      run: uv sync --dev

    - name: Run ruff check
      if: success() || failure()
      run: uv run ruff check src/ tests/ custom_components/ homeassistant-addon/ homeassistant-addon-webhook-proxy/ homeassistant-addon-webhook-proxy-dev/ scripts/

    - name: Run ruff format check on changed Python files
      if: success() || failure()
      run: |
        # Changed-files-only gate per the maintainer call on issue #1318:
        # new edits must be formatted; pre-existing format-debt on
        # untouched files stays grandfathered. Avoids the disruption of a
        # repo-wide sweep while still preventing fresh debt from landing.
        base_sha="${{ inputs.base }}"
        git fetch --depth=1 origin "$base_sha"
        changed_py=$(git diff --name-only --diff-filter=ACMR "${base_sha}" -- '*.py')
        if [ -z "$changed_py" ]; then
          echo "::notice::no Python files changed - the ruff format check did not run"
          exit 0
        fi
        count=$(echo "$changed_py" | wc -l)
        echo "Checking ruff format on $count changed Python files:"
        echo "$changed_py" | sed 's/^/  /'
        if ! echo "$changed_py" | xargs uv run ruff format --check; then
          echo "$changed_py" | xargs uv run ruff format
          git diff --binary -- '*.py' > "$RUNNER_TEMP/ruff-format.patch"
          git restore --worktree -- '*.py'
          exit 1
        fi

    - name: Upload suggested formatting
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: suggested-formatting
        path: ${{ runner.temp }}/ruff-format.patch
        if-no-files-found: ignore

    - name: Check private names reached through strings
      if: success() || failure()
      run: uv run python scripts/private_test_access.py

    - name: Run ast-grep
      if: success() || failure()
      run: uv run ast-grep scan

    - name: Run mypy
      if: success() || failure()
      # Accumulate, don't abort: under the default `bash -e` the first failing
      # invocation would hide the other trees' errors — the same failure mode
      # the per-step `if:` guards exist to prevent, one level down.
      run: |
        status=0
        uv run mypy src/ custom_components/ homeassistant-addon/ scripts/ || status=1
        uv run mypy homeassistant-addon-webhook-proxy/ || status=1
        uv run mypy homeassistant-addon-webhook-proxy-dev/ || status=1
        # The unit and app tests, against Core's real types (tests/AGENTS.md).
        uv run mypy tests/src/unit/ tests/addon/ || status=1
        exit "$status"

    # The ratchet scripts only lower their baselines, but the baselines are
    # plain files: a hand edit could raise an entry or list a new copy and
    # every other check would pass. --base also checks the files against the
    # baselines sync-ratchet-baselines.yml would write from the base, since a
    # pull request does not lower them itself. A pull request is checked out
    # as the merge commit GitHub built for the event; its first parent is the
    # base that was merged. The branch tip can move on before a job or a
    # re-run starts, and comparing with it would report entries it lowered
    # since. The shallow checkout hides the parents from rev-parse, but the
    # commit object still names them.
    - name: Check the ratchet baselines and files against the base
      if: success() || failure()
      env:
        BASE_REF: ${{ inputs.base }}
      run: |
        base_sha="$BASE_REF"
        git fetch --depth=1 origin "$base_sha"
        status=0
        uv run python scripts/module_size_ratchet.py --base "$base_sha" || status=1
        uv run python scripts/duplicate_code_ratchet.py --base "$base_sha" || status=1
        # No test is exempted from the real-Core checks (tests/AGENTS.md).
        uv run python scripts/stand_in_lists_ratchet.py --base "$base_sha" || status=1
        # No public name exists only for the tests (tests/AGENTS.md).
        uv run python scripts/test_only_public_names.py || status=1
        exit "$status"

  site-checks:
    if: inputs.mode != 'prepare'
    name: Site (astro check + eslint a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: site
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.candidate }}
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        # Corepack is bundled only through Node 24; `corepack npm ci` enforces packageManager.
        node-version: "22"
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install dependencies
      run: corepack npm ci

    - name: Astro type & diagnostics check
      run: npm run check

    - name: ESLint (eslint-plugin-astro + jsx-a11y)
      run: npm run lint

    - name: Build site
      run: npm run build

    - name: Accessibility audit (axe-core)
      # Blocking: the baseline is clean (0 violations across all pages), so a
      # new axe-core violation fails the PR rather than slipping through.
      run: npm run audit:a11y

  unit-tests:
    if: inputs.mode != 'prepare'
    name: Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each runner takes its share of the unit suite, chosen by test id
        # (tests/src/unit/_shards.py). The required check is the gate below.
        shard: ["1/2", "2/2"]
    container:
      # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
      image: ghcr.io/astral-sh/uv:0.13.9-python3.14-trixie-slim
    # Bumped 5 → 8 for the issue #2027 regression tests, which spawn real
    # subprocesses — including a full stdio server session — costing tens
    # of seconds on a slow runner. 8 → 10 after #2360: pytest alone is ~3.6
    # min and the `npm ci` step swung from 1s to 4 min during an npm registry
    # incident, so 8 left no room for one slow install. 10 → 12 for #3081:
    # the unit tests run more of Home Assistant Core's own integrations.
    timeout-minutes: 12

    steps:
    - name: Restore apt download cache
      # Cache apt downloads used by this containerized job.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/apt/archives
        key: apt-trixie-git-jq-gpp-v1

    - name: Install git, jq and g++
      run: |
        # Keep cached .debs after install so the cache stays warm for
        # future runs (default Debian behaviour deletes them).
        rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          > /etc/apt/apt.conf.d/keep-downloaded
        apt-get update -qq
        # git and jq for the workflow contract tests; g++ builds the cloud
        # integration's pymicro-vad and pyspeex-noise, which ship no 3.14 wheel.
        apt-get install -y -qq git jq g++ >/dev/null

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.candidate }}
        persist-credentials: false
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        # Corepack is bundled only through Node 24; `corepack npm ci` enforces packageManager.
        node-version: "24"
        cache: npm
        cache-dependency-path: tests/js/package-lock.json

    - name: Install Python dependencies
      run: uv sync --all-extras --dev

    - name: Install JS test dependencies (jsdom, esbuild)
      # `npm ci` enforces package-lock.json — same reproducibility
      # discipline as uv.lock on the Python side. setup-node caches npm's
      # download cache; node_modules is intentionally recreated by npm ci.
      run: cd tests/js && corepack npm ci

    - name: Run unit tests
      # xdist's `auto` counts physical cores (2 on the hosted runner);
      # `logical` uses all 4 CPUs.
      env:
        UNIT_TEST_SHARD: ${{ matrix.shard }}
      run: uv run pytest tests/src/unit/ -n logical --tb=short -v

    - name: Run BAT runner tests
      if: matrix.shard == '1/2'
      # The tests of the UAT/BAT tooling need no Docker and no model.
      # test_stories.py runs the stories themselves against a live Home
      # Assistant and an AI agent, so it stays out.
      run: >-
        uv run pytest tests/uat/
        --ignore=tests/uat/stories/test_stories.py
        -n logical --tb=short -v

    - name: Check unit tests left no local state
      # The runner's home starts without ~/.ha-mcp. A unit test that writes
      # there or leaves a settings sidecar running bypassed the isolation in
      # tests/src/unit/conftest.py and would do the same on a developer machine.
      # tests/testing_config is Core's shared config directory, which the
      # conftest's hass_config_dir replaces with a temporary one.
      run: |
        if [ -e ~/.ha-mcp ]; then
          find ~/.ha-mcp
          echo "::error::Unit tests wrote to ~/.ha-mcp"
          exit 1
        fi
        if [ -e tests/testing_config ]; then
          find tests/testing_config
          echo "::error::Unit tests wrote to Core's shared tests/testing_config"
          exit 1
        fi
        # procps (pgrep) is not in the slim image; read /proc directly.
        if grep -ls '[s]tdio_settings_sidecar' /proc/[0-9]*/cmdline; then
          echo "::error::Unit tests left a settings sidecar running"
          exit 1
        fi

    - name: Run add-on structure tests
      if: matrix.shard == '1/2'
      # tests/addon/ validates add-on packaging / config.yaml structure (e.g.
      # the backup-filename-safe name guard, #1707) — previously these ran
      # nowhere in CI. Excludes test_addon_startup.py, which spins up real
      # Docker containers (testcontainers) this lint/unit runner doesn't have.
      run: >-
        uv run pytest tests/addon/ -n logical --tb=short -v
        --ignore=tests/addon/test_addon_startup.py

    - name: Check app tests left no local state
      if: matrix.shard == '1/2'
      run: |
        if [ -e tests/testing_config ]; then
          find tests/testing_config
          echo "::error::App tests wrote to Core's shared tests/testing_config"
          exit 1
        fi

  unit-tests-gate:
    # The required "Unit Tests" check. The suite runs as a matrix, whose runners
    # report as "Unit Tests (1/2)" and "Unit Tests (2/2)", so this job carries
    # the name branch protection requires and passes only when every runner did.
    name: Unit Tests
    needs: unit-tests
    if: always() && inputs.mode != 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every unit test runner to pass
        env:
          RESULT: ${{ needs.unit-tests.result }}
        run: |
          echo "unit-tests result: $RESULT"
          [ "$RESULT" = "success" ]

  unit-tests-beta:
    if: inputs.mode != 'prepare'
    name: Unit Tests (beta Core, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same split as the stable unit job above.
        shard: ["1/2", "2/2"]
    container:
      # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
      image: ghcr.io/astral-sh/uv:0.13.9-python3.14-trixie-slim
    timeout-minutes: 15

    steps:
    - name: Restore apt download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/apt/archives
        key: apt-trixie-git-jq-gpp-v1

    - name: Install git, jq and g++
      run: |
        rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          > /etc/apt/apt.conf.d/keep-downloaded
        apt-get update -qq
        apt-get install -y -qq git jq g++ >/dev/null

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.candidate }}
        persist-credentials: false
        submodules: true

    - name: Resolve the beta Core version
      id: beta
      run: |
        python3 - <<'PY'
        import json, os, re, tomllib, urllib.request

        # The endpoint refuses urllib's default User-Agent with a 403.
        request = urllib.request.Request(
            "https://version.home-assistant.io/beta.json",
            headers={"User-Agent": "ha-mcp-ci"},
        )
        with urllib.request.urlopen(request, timeout=30) as reply:
            beta = json.load(reply)["homeassistant"]["default"]
        if not re.fullmatch(r"\d{4}\.\d{1,2}\.\d+([.]dev\d+|b\d+)?", beta):
            print(f"::error::Unexpected beta Core version: {beta}")
            raise SystemExit(1)
        with open("pyproject.toml", "rb") as project:
            dev = tomllib.load(project)["dependency-groups"]["dev"]
        pins = [
            entry.split("==", 1)[1]
            for entry in dev
            if isinstance(entry, str) and entry.startswith("homeassistant==")
        ]
        if len(pins) != 1:
            print(f"::error::Expected one homeassistant== pin in the dev group, found {pins}")
            raise SystemExit(1)
        superfluous = beta == pins[0]
        if superfluous:
            print(f"::notice::Beta Core {beta} equals the stable pin; skipping the beta unit tests")
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write(f"version={beta}\nsuperfluous={str(superfluous).lower()}\n")
        PY

    - name: Install Python dependencies with the beta Core
      id: install
      if: github.event_name == 'workflow_dispatch' || steps.beta.outputs.superfluous != 'true'
      env:
        BETA_CORE: ${{ steps.beta.outputs.version }}
      run: |
        uv sync --all-extras --dev
        # The lock holds the stable Core. Core's test plugin is built from the
        # same Core release, so both move to the beta together.
        if ! uv pip install "homeassistant==$BETA_CORE" "pytest-homeassistant==$BETA_CORE"; then
          echo "::error::PyPI has no installable homeassistant and pytest-homeassistant $BETA_CORE"
          exit 1
        fi
        uv run --no-sync python -c \
          'import os; from homeassistant.const import __version__ as v; assert v == os.environ["BETA_CORE"], v'

    - name: Set up Node.js
      if: github.event_name == 'workflow_dispatch' || steps.beta.outputs.superfluous != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        # Corepack is bundled only through Node 24; `corepack npm ci` enforces packageManager.
        node-version: "24"
        cache: npm
        cache-dependency-path: tests/js/package-lock.json

    - name: Install JS test dependencies (jsdom, esbuild)
      if: github.event_name == 'workflow_dispatch' || steps.beta.outputs.superfluous != 'true'
      run: cd tests/js && corepack npm ci

    # --no-sync throughout: a plain `uv run` re-syncs the venv to the lock and
    # would quietly test the stable Core again.
    - name: Run unit tests on the beta Core
      if: github.event_name == 'workflow_dispatch' || steps.beta.outputs.superfluous != 'true'
      env:
        UNIT_TEST_SHARD: ${{ matrix.shard }}
      run: uv run --no-sync pytest tests/src/unit/ -n logical --tb=short -q -rf

    - name: Run app tests on the beta Core
      if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.shard == '1/2' }}
      run: >-
        uv run --no-sync pytest tests/addon/ -n logical --tb=short -q -rf
        --ignore=tests/addon/test_addon_startup.py

  docker-validation:
    if: inputs.mode != 'prepare'
    name: Docker & Add-on Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.candidate }}
        persist-credentials: false
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        cache-binary: true

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # renovate: datasource=github-releases depName=astral-sh/uv
        version: "0.13.7"

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install test dependencies
      run: uv sync --dev

    # ECR Public's and Docker Hub's anonymous limits are shared by every
    # GitHub runner, so the pinned digest comes from the project's GHCR mirror
    # (mirror-python-base.yml) first, with both public registries behind it.
    # The tests below run `docker build` on the default (docker) builder,
    # which reads the pulled image from the host store, and take the registry
    # that answered through the PYTHON_BASE build arg. (The buildx publish
    # jobs use .github/actions/docker-build-python-base-fallback instead.)
    - name: Pull python base image (GHCR mirror → ECR Public → Docker Hub)
      run: |
        PYTHON_BASE_ECR=$(sed -n 's/^ARG PYTHON_BASE=//p' Dockerfile)
        [ -n "$PYTHON_BASE_ECR" ] || { echo "Dockerfile has no ARG PYTHON_BASE"; exit 1; }
        PYTHON_BASE_MIRROR="ghcr.io/homeassistant-ai/ha-mcp-python-base@${PYTHON_BASE_ECR#*@}"
        PYTHON_BASE_DOCKERHUB="docker.io/library/${PYTHON_BASE_ECR#public.ecr.aws/docker/library/}"
        for image in "$PYTHON_BASE_MIRROR" "$PYTHON_BASE_ECR" "$PYTHON_BASE_DOCKERHUB"; do
          echo "Trying $image..."
          if docker pull "$image"; then
            echo "PYTHON_BASE=$image" >> "$GITHUB_ENV"
            echo "Pulled from $image"
            exit 0
          fi
          echo "Failed to pull $image, trying next..."
          sleep 15
        done
        echo "All registries failed" && exit 1

    - name: Run add-on tests
      run: uv run pytest tests/addon/ --ignore=tests/addon/test_skills_config.py --tb=short -v

    - name: Validate docker-compose configuration
      run: uv run pytest tests/test_docker/test_docker_compose.py -v

    - name: Build and test standalone Docker image
      run: uv run pytest tests/test_docker/test_docker_build.py -v

  review-regressions:
    name: Verify review regressions against the previous PR head
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.candidate }}
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: "0.13.9"
    - run: uv sync --locked --all-extras --dev --python 3.14
    - name: Verify corrected behavior and check that the regressions detect the old production paths
      shell: bash
      run: |
        previous=35f7291bae51adb1783872ddcfc658ad9d39f41b
        units=tests/src/unit
        nodes=("$units/test_error_classification_on_core.py::test_blank_translated_service_refusal_survives_tool_error_conversion"
               "$units/test_tools_addons_lifecycle.py::TestRepositories::test_adding_a_repository_already_in_the_store_succeeds"
               "$units/test_tools_system_restart.py")
        check_proxy() {
          env NO_PROXY= no_proxy= HTTP_PROXY=http://127.0.0.1:1 http_proxy=http://127.0.0.1:1 \
            .venv/bin/pytest -q --tb=short "$units/test_dashboard_screenshot_capture.py::TestCapture::test_builds_url_and_returns_png"
        }
        check_proxy
        .venv/bin/pytest -q --tb=short "${nodes[@]}" "$units/test_get_operation_status_wait.py"
        git restore --source="$previous" --worktree -- src "$units/_screenshot_engine.py"
        rc=0
        check_proxy || rc=$?
        test "$rc" = 1
        rc=0
        .venv/bin/pytest -q --tb=short --junitxml="$RUNNER_TEMP/regressions.xml" "${nodes[@]}" || rc=$?
        test "$rc" = 1
        .venv/bin/python - <<'PY'
        import os
        from pathlib import Path
        import xml.etree.ElementTree as ET
        cases = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "regressions.xml")
        assert not cases.findall(".//testcase/error"), "regression setup failed"
        failed = [(c.get("classname", ""), c.get("name", "")) for c in cases.iter("testcase") if c.find("failure") is not None]
        print("Caught regressions on previous production code:", failed)
        for module in ("test_error_classification_on_core", "test_tools_addons_lifecycle", "test_tools_system_restart"):
            assert any(module in cls for cls, name in failed), module
        PY


  prepare-format:
    name: Prepare Ruff formatting for changed Python
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.candidate }}
        fetch-depth: 0
        persist-credentials: false
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: "0.13.9"
    - name: Generate suggested changes with the pinned Ruff
      env:
        BASE: ${{ inputs.base }}
      run: |
        mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py')
        version=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock","rb"))["package"] if p["name"]=="ruff"))')
        uvx --from "ruff==$version" ruff check --fix "${files[@]}"
        uvx --from "ruff==$version" ruff format "${files[@]}"
        git diff --binary > "$RUNNER_TEMP/review-format.patch"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: review-format
        path: ${{ runner.temp }}/review-format.patch
