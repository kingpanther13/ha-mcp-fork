name: PR2671 clean HA dependency inventory
on:
  push:
    branches: [devenv/pr2671-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect unmodified HA 2026.10 image
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/.github/pr2671-dependency-inspect.py:/probe.py:ro" \
            ghcr.io/home-assistant/home-assistant:2026.10.0b2 /probe.py
