name: PR2671 frontend diagnostics
on:
  push:
    branches: [devenv/pr2671-diagnostic]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev --python 3.14
      - run: uv pip install --no-deps home-assistant-frontend==20260930.1
      - run: |
          .venv/bin/python - <<'PY'
          import logging
          logging.basicConfig(level=logging.DEBUG)
          from tests.src.unit.test_card_definitions import cd
          import hass_frontend
          cd._ENGINE_JS = cd._ENGINE_JS.replace('delete CACHE[id]; throw e;', "delete CACHE[id]; throw new Error('module ' + id + ': ' + e + (e instanceof TypeError ? ' source: ' + REG[id].toString() : ''));")
          d=cd.CardDefinitions(hass_frontend.where())
          print('ROOT',hass_frontend.where())
          print('TILE FIELDS',d.describe('tile'))
          warnings=d.validate({'views':[{'cards':[{'type':'tile','entity':'light.test','colour':'red'}, {'type':'button','entitty':'x'}]}]})
          print('WARNINGS',warnings)
          assert any('colour' in w for w in warnings)
          PY
