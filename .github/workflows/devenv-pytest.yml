name: Dev pytest on tracked branch

# Fork-only helper: runs lint and a pytest selection from TRACK_REF on a
# GitHub runner, so iteration never runs the suite on the resource-limited
# dev box. Never ships in an upstream PR.
on:
  # A push indexes the workflow so it becomes dispatchable (GitHub only lists
  # workflows that ran once); the push run uses the env defaults below.
  push:
    branches: ["devenv/**"]
    paths: [".github/workflows/devenv-pytest.yml"]
  workflow_dispatch:
    inputs:
      track_ref:
        description: Branch to test
        required: true
      pytest_args:
        description: pytest selection and flags
        default: "tests/src/unit/"
      lint:
        description: Run ruff + mypy first
        default: "true"

permissions:
  contents: read

env:
  TRACK_REF: ${{ inputs.track_ref || 'fix/issue-2619-area-sensor-refs' }}
  PYTEST_ARGS: ${{ inputs.pytest_args || 'tests/src/unit/test_tools_areas.py' }}
  LINT: ${{ inputs.lint || 'false' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TRACK_REF }}
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: ruff + mypy
        if: env.LINT == 'true'
        run: |
          uv run ruff check src/ tests/ custom_components/ homeassistant-addon/ homeassistant-addon-webhook-proxy/ homeassistant-addon-webhook-proxy-dev/ packaging/ scripts/
          uv run ruff format --check src/ tests/ custom_components/
          uv run mypy src/ custom_components/ homeassistant-addon/ scripts/
      - name: pytest
        run: uv run pytest ${{ env.PYTEST_ARGS }} -n auto --tb=short -v
