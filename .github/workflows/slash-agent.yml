name: Maintainer slash agent

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      [
        Slash agent review event,
        PR Validation Pipeline,
        HAOS E2E Tests,
        CodeQL Code Quality,
        Send Codex PR Review,
      ]
    types: [completed]
  status:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue or same-repository PR containing the maintainer command.
        required: true
        type: number
      comment_id:
        description: Existing maintainer slash comment to process.
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

jobs:
  route:
    # A skipped job takes no runner. Comments route only when they can carry a
    # command (bot comments never do); CI and status wakeups route only for a
    # branch the publisher lists in SLASH_AGENT_WAKE_BRANCHES, and every event
    # routes while that variable is unset. Dependency-bot branches never wake.
    if: >-
      github.repository == 'homeassistant-ai/ha-mcp' &&
      vars.HA_MCP_AGENT_APP_SLUG != '' &&
      vars.HA_MCP_AGENT_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      github.event.comment.user.type == 'User' &&
      (contains(github.event.comment.body, '/astra') ||
      contains(github.event.comment.body, '/sol') ||
      contains(github.event.comment.body, '/terra'))) ||
      ((github.event_name == 'workflow_run' || github.event_name == 'status') &&
      !startsWith(github.event.workflow_run.head_branch || github.event.branches[0].name, 'dependabot/') &&
      !startsWith(github.event.workflow_run.head_branch || github.event.branches[0].name, 'renovate/') &&
      (vars.SLASH_AGENT_WAKE_BRANCHES == '' ||
      contains(fromJSON(vars.SLASH_AGENT_WAKE_BRANCHES || '[]'), github.event.workflow_run.head_branch || github.event.branches[0].name))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.route.outputs.run }}
      root: ${{ steps.route.outputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - name: Resolve the canonical session without reserving model work
        id: route
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          HA_MCP_APP_SLUG: ${{ vars.HA_MCP_AGENT_APP_SLUG }}
        run: node .github/slash-agent/main.mjs route

  session:
    needs: route
    if: needs.route.outputs.run == 'true'
    concurrency:
      group: slash-agent-session-${{ github.repository }}-${{ needs.route.outputs.root }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/slash-agent-session.yml
    with:
      session_root: ${{ needs.route.outputs.root }}
    secrets:
      CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
      CODEX_AUTH_PAT: ${{ secrets.CODEX_AUTH_PAT }}
      HA_MCP_AGENT_APP_PRIVATE_KEY: ${{ secrets.HA_MCP_AGENT_APP_PRIVATE_KEY }}
