name: One-off HACS Install Flow

# Scratch-branch throwaway: proves the user path "HACS download -> install ->
# restart HA -> component works" on the UNSUPERVISED container, x64 + arm64.
# Delete the scratch branch when done.
on:
  push:
    branches: ['scratch/oneoff-hacs-flow']

permissions:
  contents: read

jobs:
  hacs-install-flow:
    name: HACS install flow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Pull HA image
        run: docker pull ghcr.io/home-assistant/home-assistant:2026.6.4

      - name: Run the flow
        run: uv run python scripts/oneoff_hacs_install_flow.py
        env:
          HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.6.4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
