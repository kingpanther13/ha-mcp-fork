name: Issue 2532 published-image reproduction
on:
  push:
    branches: [investigate/issue-2532-repro]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      HA_TEST_IMAGE: ghcr.io/home-assistant/home-assistant:2026.9.1
      E2E_NO_TOOLS_ENTRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.12.15'
      - run: uv sync --locked --dev
      - name: Pull released images
        run: |
          docker pull ghcr.io/homeassistant-ai/ha-mcp:7.6.0
          docker pull ghcr.io/homeassistant-ai/ha-mcp:8.5.0
          docker pull "$HA_TEST_IMAGE"
      - name: Exercise released launchers against disposable HA
        working-directory: tests
        run: uv run pytest src/e2e/test_issue2532_repro.py -v -s --tb=short --maxfail=0 --junitxml=issue2532.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue2532-evidence
          path: |
            tests/issue2532.xml
            tests/issue2532-evidence/
