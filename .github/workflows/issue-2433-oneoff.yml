name: Issue 2433 one-off validation
on:
  push:
    branches: [ci/issue-2433-readonly]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
      - run: uv sync --all-extras --dev
      - name: Focused endpoint regression
        working-directory: tests
        run: uv run pytest addon/test_webhook_proxy.py src/unit/test_webhook_proxy_dev_isolation.py src/unit/test_mcp_webhook.py src/unit/test_readonly_endpoint.py src/unit/test_read_only.py src/unit/test_call_service_read_only.py src/unit/test_http_transport_options.py src/unit/test_server_readonly_wiring.py --maxfail=0 -q
      - name: Lint
        run: uv run ruff check src/ custom_components/ha_mcp_tools/ homeassistant-addon-webhook-proxy-dev/mcp_proxy_dev/ tests/src/unit/test_readonly_endpoint.py tests/src/unit/test_mcp_webhook.py tests/src/e2e/policy/test_readonly_endpoint.py tests/addon/test_webhook_proxy.py
      - name: Types
        run: uv run mypy src/
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
      - run: uv sync --all-extras --dev
      - name: Read-only E2E against isolated HA
        working-directory: tests
        run: uv run pytest src/e2e/policy/test_readonly_endpoint.py src/e2e/policy/test_readonly_mode.py --maxfail=0 -q

