name: Issue 2433 one-off validation
on:
  push:
    branches: [ci/issue-2433-readonly]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
      - run: uv sync --all-extras --dev
      - name: Focused endpoint regression
        working-directory: tests
        run: uv run pytest src/unit/test_categorized_search.py src/unit/test_overview_system_info.py src/unit/test_dashboard_screenshot_theme_guard.py src/unit/test_webhook_proxy_dev_isolation.py src/unit/test_mcp_webhook.py src/unit/test_readonly_endpoint.py src/unit/test_read_only.py src/unit/test_call_service_read_only.py src/unit/test_http_transport_options.py src/unit/test_server_readonly_wiring.py --maxfail=0 -q
      - name: Proxy app regressions
        if: always()
        run: uv run pytest tests/addon/test_webhook_proxy.py --maxfail=0 -q
      - name: Lint
        if: always()
        run: uv run ruff check src/ custom_components/ha_mcp_tools/ homeassistant-addon-webhook-proxy-dev/mcp_proxy_dev/ tests/src/unit/test_readonly_endpoint.py tests/src/unit/test_mcp_webhook.py tests/src/e2e/policy/test_readonly_endpoint.py tests/addon/test_webhook_proxy.py
      - name: Types
        if: always()
        run: |
          uv run mypy src/ custom_components/
          uv run mypy homeassistant-addon-webhook-proxy-dev/
  e2e:
    if: false # Only test lint/docs changed; prior run covers production/E2E.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
      - run: uv sync --all-extras --dev
      - name: Read-only E2E against isolated HA
        working-directory: tests
        run: uv run pytest src/e2e/policy/test_readonly_endpoint.py src/e2e/policy/test_readonly_mode.py --maxfail=0 -q

  embedded:
    if: false # Production and E2E code are unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      E2E_BACKEND: embedded
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"
      - run: uv sync --all-extras --dev
      - name: Real Home Assistant webhook E2E
        working-directory: tests
        run: uv run pytest src/e2e/policy/test_readonly_endpoint.py::test_embedded_webhook_readonly_endpoint --maxfail=0 -q

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      # renovate: datasource=docker depName=ghcr.io/astral-sh/uv
      image: ghcr.io/astral-sh/uv:0.12.11-python3.13-trixie-slim
    # Bumped 5 → 8 for the issue #2027 regression tests, which spawn real
    # subprocesses — including a full stdio server session — costing tens
    # of seconds on a slow runner. 8 → 10 after #2360: pytest alone is ~3.6
    # min and the `npm ci` step swung from 1s to 4 min during an npm registry
    # incident, so 8 left no room for one slow install.
    timeout-minutes: 10

    steps:
    - name: Restore apt download cache
      # Cache apt downloads used by this containerized job.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /var/cache/apt/archives
        key: apt-trixie-git-jq-v1

    - name: Install git and jq for workflow contract tests
      run: |
        # Keep cached .debs after install so the cache stays warm for
        # future runs (default Debian behaviour deletes them).
        rm -f /etc/apt/apt.conf.d/docker-clean
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          > /etc/apt/apt.conf.d/keep-downloaded
        apt-get update -qq
        apt-get install -y -qq git jq >/dev/null

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        submodules: true

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # Corepack is bundled only through Node 24; `corepack npm ci` enforces packageManager.
        node-version: "24"
        cache: npm
        cache-dependency-path: tests/js/package-lock.json

    - name: Install Python dependencies
      run: uv sync --all-extras --dev

    - name: Install JS test dependencies (jsdom, esbuild)
      # `npm ci` enforces package-lock.json — same reproducibility
      # discipline as uv.lock on the Python side. setup-node caches npm's
      # download cache; node_modules is intentionally recreated by npm ci.
      run: cd tests/js && corepack npm ci

    - name: Run unit tests
      run: uv run pytest tests/src/unit/ -n auto --tb=short -v

    - name: Run add-on structure tests
      # tests/addon/ validates add-on packaging / config.yaml structure (e.g.
      # the backup-filename-safe name guard, #1707) — previously these ran
      # nowhere in CI. Excludes test_addon_startup.py, which spins up real
      # Docker containers (testcontainers) this lint/unit runner doesn't have.
      run: >-
        uv run pytest tests/addon/ -n auto --tb=short -v
        --ignore=tests/addon/test_addon_startup.py

  # Comprehensive E2E validation for all PRs
