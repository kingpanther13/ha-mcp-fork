name: tmp race repro
on:
  push:
    branches: [ci/tmp-3067-race]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - run: uv sync --all-extras --dev
      - name: New checks on the real code
        run: >
          uv run pytest tests/addon/webhook_proxy/test_legacy_oauth_authorize.py
          tests/addon/webhook_proxy/test_start_main.py tests/addon/webhook_proxy/test_start_install.py
          -k "safe_redirect or updated_component or first_install or same_version or corrupt_deployed"
          -q -rA -p no:cacheprovider
      - name: Remove the hostname check and change the banner
        run: |
          uv run python - <<'PY'
          for p in ("homeassistant-addon-webhook-proxy/mcp_proxy/oauth.py", "homeassistant-addon-webhook-proxy-dev/mcp_proxy_dev/oauth.py"):
              t = open(p).read(); s = "    if not parsed.hostname:\n        return False\n"
              assert t.count(s) == 1, p; open(p, "w").write(t.replace(s, ""))
          for p in ("homeassistant-addon-webhook-proxy/start.py", "homeassistant-addon-webhook-proxy-dev/start.py"):
              t = open(p).read(); assert t.count("INTEGRATION UPDATED") == 1, p
              open(p, "w").write(t.replace("INTEGRATION UPDATED", "INTEGRATION REFRESHED"))
          PY
      - name: Same checks against the mutated code (expected to fail)
        run: >
          uv run pytest tests/addon/webhook_proxy/test_legacy_oauth_authorize.py
          tests/addon/webhook_proxy/test_start_main.py tests/addon/webhook_proxy/test_start_install.py
          -k "safe_redirect or updated_component or first_install or same_version or corrupt_deployed"
          -q -rA -p no:cacheprovider || true
