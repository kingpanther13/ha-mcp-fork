name: repro-2374
on:
  workflow_dispatch:
env:
  HOMEASSISTANT_URL: http://127.0.0.1:1
  HOMEASSISTANT_TOKEN: dummy-token
  HA_MCP_DISABLE_UPDATE_CHECK: "1"
jobs:
  claude-code-cli:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          prune-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude mcp add + list
        shell: pwsh
        run: |
          npm i -g @anthropic-ai/claude-code | Out-Null
          claude --version
          claude mcp add-json -s user ha-mcp '{"type":"stdio","command":"uvx","args":["ha-mcp@latest"],"env":{"HOMEASSISTANT_URL":"http://127.0.0.1:1","HOMEASSISTANT_TOKEN":"dummy-token","HA_MCP_DISABLE_UPDATE_CHECK":"1"}}'
          claude mcp get ha-mcp
          "=== claude mcp list ==="
          claude mcp list
          "rc=$LASTEXITCODE"
