name: TMP non-e2e checks
on:
  workflow_dispatch:
    inputs:
      tests:
        description: pytest targets
        required: true
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:0.13.6-python3.14-trixie-slim
    timeout-minutes: 12
    steps:
    - run: apt-get update -qq && apt-get install -y -qq git jq >/dev/null
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
    - run: uv sync --all-extras --dev
    - name: Run targeted tests
      env:
        TESTS: ${{ inputs.tests }}
      run: uv run pytest --maxfail=80 $TESTS -n 4 --tb=short -q -p no:cacheprovider -o addopts="-p no:pytest_homeassistant -p no:respx -ra"
