name: TMP non-e2e checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv lock
      - run: uv run --no-project --with packaging python -I scripts/check_ha_constraint_alignment.py --sync-lock
      - run: uv lock --check
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
