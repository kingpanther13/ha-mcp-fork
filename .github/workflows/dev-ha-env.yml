name: Dev HA environment

# A long-running HA test instance behind a temporary Cloudflare tunnel, for
# live testing. It follows TRACK_REF: pushing component changes there
# reinstalls the component and restarts HA. The tunnel URL is the `devenv-url`
# artifact. Cancel the run when the task is done.
on:
  push:
    branches: ["devenv/**"]
  workflow_dispatch:
    inputs:
      track_ref:
        description: Branch whose server, component and test config to run
        required: true
      ha_image:
        description: HA container image
        default: ghcr.io/home-assistant/home-assistant:2026.10.0b0
      minutes:
        description: How long to keep the instance up
        default: "340"

permissions:
  contents: read

concurrency:
  group: dev-ha-env-${{ github.ref_name }}
  cancel-in-progress: true

env:
  TRACK_REF: ${{ inputs.track_ref || 'fix/issue-2619-area-sensor-refs' }}
  HA_TEST_IMAGE: ${{ inputs.ha_image || 'ghcr.io/home-assistant/home-assistant:2026.10.0b0' }}
  MINUTES: ${{ inputs.minutes || '340' }}
  # A fixed host port survives container restarts, so the tunnel target holds.
  HA_TEST_PORT: "8123"
  # devenv/nocomp*: no ha_mcp_tools component at all, as the no-component e2e lane.
  E2E_NO_TOOLS_ENTRY: ${{ contains(github.ref_name, 'nocomp') && '1' || '' }}
  # The tracked branch's server runs beside HA; its tunnel is in devenv-url too.
  MCP_PORT: "8086"

jobs:
  env:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: devenv
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TRACK_REF }}
          path: src
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
      - name: Install test dependencies
        working-directory: src
        run: uv sync --all-extras --dev
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
      - name: Boot HA and open the tunnel
        env:
          SRC_DIR: ${{ github.workspace }}/src
          PORT_FILE: ${{ github.workspace }}/port
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SECRET="mcp-$(openssl rand -hex 16)"
          export MCP_SECRET_PATH="/$SECRET"
          cd src
          nohup uv run python ../devenv/.github/devenv/run_env.py > ../env.log 2>&1 &
          echo $! > ../runner.pid
          cd ..
          for i in $(seq 1 120); do
            [ -s port ] && break
            kill -0 "$(cat runner.pid)" 2>/dev/null || break
            sleep 5
          done
          if [ ! -s port ]; then echo "HA never came up"; tail -100 env.log; exit 1; fi
          PORT=$(cat port)
          nohup ./cloudflared tunnel --no-autoupdate --url "http://localhost:$PORT" > tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$URL" ] && break; sleep 2
          done
          echo "$URL" > devenv-url.txt
          nohup ./cloudflared tunnel --no-autoupdate --url "http://localhost:$MCP_PORT" > tunnel-mcp.log 2>&1 &
          for i in $(seq 1 60); do
            MURL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel-mcp.log | head -1)
            [ -n "$MURL" ] && break; sleep 2
          done
          echo "$MURL/$SECRET" >> devenv-url.txt
          echo "port=$PORT url=$URL"
          tail -20 env.log
      - uses: actions/upload-artifact@v4
        with:
          name: devenv-url
          path: devenv-url.txt
          retention-days: 1
      - name: Keep running
        run: |
          end=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            sleep 60
            grep -E "STATUS|Traceback|Error" env.log | tail -3 || true
          done
      - name: Logs
        if: always()
        run: |
          docker ps --format '{{.Image}} {{.Status}} {{.Ports}}' || true
          tail -200 env.log; tail -50 tunnel.log; tail -100 server.log || true
