name: tmp hang repro
on:
  push:
    branches: [ci/tmp-3023-hang]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - run: uv sync --all-extras --dev
      - name: Probe ran-without-traces
        run: uv run pytest tests/src/unit/test_tmp_ran_without_traces.py -s -q -p no:cacheprovider
