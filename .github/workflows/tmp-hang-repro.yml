name: tmp hang repro
on:
  push:
    branches: [ci/tmp-3023-hang]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/astral-sh/uv:0.13.7-python3.14-trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
      - run: uv sync --all-extras --dev
      - name: Repeat the frozen-clock trace tests
        run: >
          uv run --with pytest-repeat pytest tests/src/unit/test_tools_traces.py
          -k "pages_traces or mixed_not_triggered" --count 40 -n 4
          --timeout=30 --timeout-method=signal -o timeout_func_only=true
          -p no:cacheprovider --tb=long -q -rf
